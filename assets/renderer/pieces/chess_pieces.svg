<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">Chess piece sprite sheet and symbol library</title>
  <desc id="desc">Twelve flat vector chess pieces in a 6 by 2 grid. Top row white pieces, bottom row black pieces. Each symbol is scaled about the shared baseline at y=160 so the set carries a readable height hierarchy at 90px: king tallest, pawn shortest.</desc>
