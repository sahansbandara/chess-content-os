    <style>
      .pc-white { fill: #F2EDDF; stroke: #1E2A44; }
      .pc-black { fill: #1E2A44; stroke: #F2EDDF; }
      .pc-piece { stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
    </style>

    <symbol id="white-king" viewBox="0 0 180 180">
      <g transform="translate(90,160) scale(1.1829) translate(-90,-160)">
      <g class="pc-piece pc-white">
        <path d="M80 20h20v16h16v16h-16v16H80V52H64V36h16z"/>
        <path d="M66 74h48l-6 18c20 9 30 22 30 40H42c0-18 10-31 30-40z"/>
        <path d="M54 132h72v12H54z"/>
        <path d="M48 144h84v16H48z"/>
      </g>
      </g>
    </symbol>

    <symbol id="white-queen" viewBox="0 0 180 180">
