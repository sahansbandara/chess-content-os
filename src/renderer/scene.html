<!doctype html>
<meta charset="utf-8">
<title>Chess Content OS — scene</title>
<style>
  html,body{margin:0;padding:0;background:#0E1013;width:1080px;height:1920px;overflow:hidden}
  *{box-sizing:border-box}
  #stage{position:relative;width:1080px;height:1920px;
         font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
         -webkit-font-smoothing:antialiased}
  /* Three surfaces only: character + bubble, complete board, verdict. */
  #mascot{position:absolute;left:0;top:20px;width:520px;height:500px;
          background-repeat:no-repeat;background-position:bottom center;
          background-size:contain;will-change:transform;z-index:3}
  #bubble{position:absolute;left:460px;top:280px;width:550px;min-height:132px;
          background:#1B2027;border:3px solid #E0A33E;border-radius:26px;padding:24px 30px;
          color:#EDF1F6;font-size:34px;font-weight:700;line-height:1.25;
          box-shadow:0 12px 40px rgba(0,0,0,.45);z-index:4;
          will-change:transform,opacity}
  #bubble:after{content:"";position:absolute;left:-27px;top:46px;
                border:18px solid transparent;border-right-color:#E0A33E;
                border-left:0}

  #board{position:absolute;left:0;top:520px;width:1080px;height:1080px;overflow:hidden}
  #squares{position:absolute;inset:0}
  #pieces{position:absolute;inset:0}
  .sq{position:absolute;width:135px;height:135px}
  .hl{position:absolute;width:135px;height:135px;background:#E0A33E;opacity:.34}
  .hl.bad{background:#C6434A;opacity:.52}
  .pc{position:absolute;width:135px;height:135px;
       background-repeat:no-repeat;background-position:center;background-size:100% 100%}
  #verdict{position:absolute;left:90px;top:1640px;width:900px;height:150px;
           border:3px solid rgba(255,255,255,.10);border-radius:28px;
           background:#1A1F26;color:#E8EDF3;display:flex;align-items:center;
           justify-content:center;font-size:54px;font-weight:900;
           letter-spacing:2px;text-transform:uppercase;will-change:transform,opacity}
  #verdict.bad{background:#431E24;border-color:#A9434E;color:#FFC0C6}
  #verdict.good{background:#173A29;border-color:#3B8B5D;color:#A8F2C1}
  #verdict:empty{opacity:0}
  .safe{position:absolute;pointer-events:none}
</style>

<div id="stage">
  <div id="mascot"></div>
  <div id="bubble"></div>
  <div id="board"><div id="squares"></div><div id="pieces"></div></div>
  <div id="verdict"></div>
</div>

<script>
const SCENE = window.__SCENE__ || {};
// Supplied piece art, keyed by FEN symbol. Absent means fall back to the
// vector glyphs below, which is what shipped before the art existed.
const PIECE_ART = window.__PIECE_ART__ || {};
const MASCOT_ART = window.__MASCOT_ART__ || {};
const CUES = SCENE.cues || [];
const SQ = 135;
const CREAM = "#F2EDDF", NAVY = "#1E2A44";

// --- original vector piece glyphs -------------------------------------------
// Drawn here rather than shipped as art: nothing to license, nothing to attribute.
//
// Every piece is built from primitives that share one baseline (y=88) and one
// foot, so the set reads as a family. Height carries the hierarchy — pawn
// shortest, king tallest — because at 100px on a phone the silhouette is all a
// viewer gets; interior detail is invisible.
//
// The parts overlap on purpose. pieceSVG paints the outline pass first and the
// fill pass over it, so the seams between parts disappear and each piece ends up
// with a single clean contour instead of a stack of outlined blobs.
const FOOT = '<path d="M22 89 h56 a3 3 0 0 0 3 -3 v-1 l-8 -8 h-46 l-8 8 v1 a3 3 0 0 0 3 3 z"/>';

const GLYPH = {
  p: FOOT
   + '<path d="M33 79 q0 -17 17 -24 q17 7 17 24 z"/>'
   + '<rect x="30" y="74" width="40" height="9" rx="4"/>'
   + '<path d="M43 58 q7 -6 14 0 z"/>'
   + '<rect x="44" y="44" width="12" height="14" rx="5"/>'
   + '<circle cx="50" cy="36" r="12"/>',

  r: FOOT
   + '<path d="M31 80 l4 -29 h30 l4 29 z"/>'
   + '<rect x="27" y="44" width="46" height="10" rx="3"/>'
   + '<path d="M28 48 v-22 h11 v9 h7 v-9 h8 v9 h7 v-9 h11 v22 z"/>',

  n: FOOT
   + '<rect x="27" y="73" width="46" height="10" rx="4"/>'
   + '<path d="M40 74 c-2 -14 2 -22 8 -28 l-9 4 c-6 3 -12 2 -13 -3 '
   + 'c-1 -6 6 -13 13 -18 c3 -6 9 -11 17 -12 c9 -1 15 6 16 16 '
   + 'c1 12 -3 26 -6 41 z"/>',

  b: FOOT
   + '<path d="M35 79 q-1 -14 15 -20 q16 6 15 20 z"/>'
   + '<rect x="30" y="73" width="40" height="10" rx="4"/>'
   + '<path d="M41 61 c-7 -15 -1 -28 9 -37 c10 9 16 22 9 37 z"/>'
   + '<circle cx="50" cy="21" r="5"/>',

  q: FOOT
   + '<path d="M30 80 q-3 -20 9 -28 h22 q12 8 9 28 z"/>'
   + '<rect x="28" y="50" width="44" height="10" rx="4"/>'
   + '<path d="M36 54 l-5 -21 l12 10 l7 -19 l7 19 l12 -10 l-5 21 z"/>'
   + '<circle cx="31" cy="31" r="5"/><circle cx="69" cy="31" r="5"/>'
   + '<circle cx="50" cy="20" r="6"/>',

  k: FOOT
   + '<path d="M30 80 q-3 -20 10 -28 h20 q13 8 10 28 z"/>'
   + '<rect x="28" y="50" width="44" height="10" rx="4"/>'
   + '<path d="M37 54 q-5 -16 13 -20 q18 4 13 20 z"/>'
   + '<rect x="45" y="10" width="10" height="26" rx="3"/>'
   + '<rect x="37" y="18" width="26" height="10" rx="3"/>'
};

// The knight needs one interior mark: without an eye it reads as a fin.
// Interior marks, painted last in the outline colour. Only where a silhouette
// alone is ambiguous: the knight reads as a fin without an eye, and the bishop
// reads as a tall pawn without its mitre slit.
const DETAIL = {
  n: '<circle cx="58" cy="35" r="3"/>',
  b: '<path d="M55 32 l-10 14" fill="none" stroke-width="5"/>'
};

function pieceMarkup(sym){
  // The div carries data-piece so the board can be read back without inspecting
  // paint. Colour lives in the symbol's case, which is the FEN convention.
  const art = PIECE_ART[sym];
  const style = art ? ';background-image:url(' + art + ')' : '';
  return { style: style, inner: art ? '' : pieceSVG(sym) };
}


function pieceSVG(sym){
  const white = sym === sym.toUpperCase();
  const body = white ? CREAM : NAVY;
  const line = white ? NAVY : CREAM;
  const d = GLYPH[sym.toLowerCase()];
  const detail = DETAIL[sym.toLowerCase()] || "";
  // Outline pass under fill pass: the fills hide every seam where the primitives
  // overlap, leaving one contour around the whole piece.
  return '<svg viewBox="0 0 100 100" width="'+SQ+'" height="'+SQ+'">'
       + '<g stroke="'+line+'" stroke-width="7" fill="none" '
       + 'stroke-linejoin="round" stroke-linecap="round">' + d + '</g>'
       + '<g data-body="1" fill="'+body+'" stroke="none">' + d + '</g>'
       + '<g fill="'+line+'" stroke="'+line+'" stroke-linecap="round">' + detail + '</g>'
       + '</svg>';
}

// Orientation follows the owner's side, so the video shows the game as they saw it.
function xy(square){
  const file = square.charCodeAt(0) - 97;
  const rank = parseInt(square[1], 10);
  if (SCENE.flip) return { x: (7 - file) * SQ, y: (rank - 1) * SQ };
  return { x: file * SQ, y: (8 - rank) * SQ };
}

// Popup lifecycle from design.md: slide in, overshoot, settle, hold, exit.
// Driven entirely by the frame number — no wall-clock animation anywhere, or
// the same input would stop producing the same output.
const ENTER_F = 12, EXIT_F = 8;

function backOut(t){
  // overshoot then settle; the pawn arrives with weight rather than sliding to
  // a dead stop
  const c1 = 1.9, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function activeCue(frame){
  for (const c of CUES)
    if (frame >= c.start_frame && frame < c.end_frame) return c;
  return null;
}

function mascotOffset(cue, frame){
  // returns how far right of its resting place the pawn sits, in pixels
  const inFrames = frame - cue.start_frame;
  const outFrames = cue.end_frame - frame;
  if (inFrames < ENTER_F) return 440 * (1 - backOut(inFrames / ENTER_F));
  if (outFrames < EXIT_F) return 440 * (1 - outFrames / EXIT_F);
  return 0;
}

const PIECE_NAMES = {k:"King",q:"Queen",r:"Rook",b:"Bishop",n:"Knight",p:"Pawn"};
const QUALITY_LABELS = {
  blunder:"Blunder", mistake:"Mistake", inaccuracy:"Inaccuracy",
  good:"Good move", best:"Best move"
};
const BAD_LABELS = {blunder:true, mistake:true, inaccuracy:true};

function drawSquares(){
  let h = "";
  for (let r = 0; r < 8; r++)
    for (let f = 0; f < 8; f++)
      h += '<div class="sq" style="left:'+(f*SQ)+'px;top:'+(r*SQ)+'px;background:'
         + (((r+f)%2) ? '#739552' : '#EBECD0') + '"></div>';
  document.getElementById("squares").innerHTML = h;
}

const easeInOutCubic = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;

// --- the only entry point ----------------------------------------------------
// Output is a pure function of the frame number. No wall clock, no CSS animation,
// no randomness — the same frame always renders identically.
function renderFrame(n){
  const fps = SCENE.fps, t = n / fps;

  const hookEnd = SCENE.hook_s;
  const step = SCENE.step_s;
  const slide = SCENE.slide_s;

  let idx = Math.floor((t - hookEnd) / step);
  let local = 0;
  if (idx < 0) { idx = 0; }
  else if (idx >= SCENE.moves.length) { idx = SCENE.moves.length - 1; local = 1; }
  else { local = Math.min(1, ((t - hookEnd) - idx * step) / slide); }
  if (t < hookEnd) local = 0;

  const mv = SCENE.moves[idx];
  const started = t >= hookEnd;
  const p = easeInOutCubic(local);

  // pieces: the position before this move, with the mover interpolated
  let html = "";
  if (started && mv.captured_square && local > 0.35) {
    // captured piece fades as the attacker lands on it
    const c = xy(mv.captured_square);
    const a = Math.max(0, 1 - (local - 0.35) / 0.35);
    const art = pieceMarkup(mv.captured_piece);
    html += '<div class="pc" data-piece="'+mv.captured_piece+'" style="left:'+c.x+'px;top:'+c.y
          + 'px;opacity:'+a.toFixed(3)+art.style+'">' + art.inner + '</div>';
  }
  for (const [sq, sym] of Object.entries(mv.before)) {
    if (started && sq === mv.from) continue;
    if (started && mv.captured_square === sq) continue;
    const c = xy(sq);
    const art = pieceMarkup(sym);
    html += '<div class="pc" data-piece="'+sym+'" style="left:'+c.x+'px;top:'+c.y+'px'
          + art.style+'">' + art.inner + '</div>';
  }
  if (started) {
    const a = xy(mv.from), b = xy(mv.to);
    const x = a.x + (b.x - a.x) * p, y = a.y + (b.y - a.y) * p;
    const art = pieceMarkup(mv.piece);
    html += '<div class="pc" data-piece="'+mv.piece+'" style="left:'+x+'px;top:'+y
          + 'px;z-index:5'+art.style+'">' + art.inner + '</div>';
  }

  // last-move highlight, only once the piece has landed
  let hl = "";
  if (started && local >= 1) {
    for (const sq of [mv.from, mv.to]) {
      const c = xy(sq);
      const bad = BAD_LABELS[mv.label] ? " bad" : "";
      hl += '<div class="hl'+bad+'" style="left:'+c.x+'px;top:'+c.y+'px"></div>';
    }
  }
  document.getElementById("pieces").innerHTML = hl + html;

  // One verdict only below board. No competing move, piece, or evaluation UI.
  const verdict = document.getElementById("verdict");
  const moveElapsed = started ? (t - hookEnd) - idx * step : -1;
  const verdictAge = moveElapsed - slide;
  const verdictReady = verdictAge >= 0 && verdictAge <= 1.10 && QUALITY_LABELS[mv.label];
  verdict.textContent = verdictReady ? QUALITY_LABELS[mv.label] : "";
  verdict.className = verdictReady ? (BAD_LABELS[mv.label] ? "bad" : "good") : "";
  if (verdictReady) {
    const progress = Math.min(1, verdictAge / 1.10);
    const pop = 0.76 + 0.24 * backOut(Math.min(1, verdictAge / 0.34));
    const shake = BAD_LABELS[mv.label]
      ? Math.sin(verdictAge * 72) * 15 * Math.max(0, 1 - verdictAge / 0.48)
      : 0;
    verdict.style.transform = "translateX("+shake.toFixed(2)+"px) scale("+pop.toFixed(3)+")";
    verdict.style.opacity = (progress > 0.82 ? (1 - progress) / 0.18 : 1).toFixed(3);
  } else {
    verdict.style.transform = "scale(.76)";
    verdict.style.opacity = "0";
  }

  // mascot and its bubble. The bubble is the mascot's only text surface and it
  // appears and leaves with it — never a second caption competing with the hook.
  const cue = activeCue(n);
  const mascot = document.getElementById("mascot");
  const bubble = document.getElementById("bubble");
  const art = cue ? MASCOT_ART[cue.expression] : null;
  if (cue && art) {
    const off = mascotOffset(cue, n);
    mascot.style.backgroundImage = "url(" + art + ")";
    mascot.style.transform = "translateX(" + (-off).toFixed(2) + "px)";
    bubble.textContent = cue.text;
    bubble.style.opacity = Math.max(0, 1 - off / 160).toFixed(3);
    bubble.style.transform = "translateX(" + (-off * 0.45).toFixed(2) + "px)";
  } else {
    mascot.style.backgroundImage = "none";
    bubble.textContent = "";
    bubble.style.opacity = "0";
  }
}

drawSquares();
window.renderFrame = renderFrame;
renderFrame(0);
</script>
