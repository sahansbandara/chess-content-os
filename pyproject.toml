[project]
name = "chess-content-os"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.18.1",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "python-chess>=1.999",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
